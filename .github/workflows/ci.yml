name: Data Pipeline CI Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set Up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set Up UV Package Manager
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        version: "latest"

    - name: Setup Python Environment
      run: uv python install 3.10

    - name: Install Virtual Environment Dependencies
      run: |
        uv venv
        uv sync --dev

    - name: Execute Automated Test Suite
      run: |
        # force worker threads to match python runtime exactly
        # comments should be lowercase and without dots
        export PYSPARK_PYTHON=$(uv run python -c "import sys; print(sys.executable)")
        export PYSPARK_DRIVER_PYTHON=$PYSPARK_PYTHON
        
        uv run python -m pytest tests/ -v